<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Gambar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Mencegah scrollbar muncul saat gambar pas di layar */
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        img {
            max-width: 100%;
            max-height: 90vh; /* Membatasi tinggi gambar agar tidak melebih batas layar HP/Laptop */
            width: auto;
            height: auto;
            object-fit: contain; /* Memastikan rasio gambar tetap proporsional tanpa terdistorsi */
            border-radius: 10px; 
        }

        /* Tampilan saat akses ditolak */
        .access-denied {
            display: none;
            color: #dc2626;
            text-align: center;
        }
    </style>
</head>

<body oncontextmenu="return false;">

    <!-- Pesan jika dibuka langsung tanpa token -->
    <div id="accessDenied" class="access-denied">
        <h2>Akses Ditolak</h2>
        <p>Anda tidak memiliki izin untuk mengakses halaman ini secara langsung.</p>
    </div>

    <!-- Konten Gambar (Default tersembunyi) -->
    <div class="container" id="mainContainer" style="display: none;">
        <img src="asesemen.png" alt="Gambar Tengah">
    </div>

    <script>
        // Validasi Security Token dari URL
        const EXPECTED_TOKEN = "AksesKhususGoogleSites2026";

        function checkAccess() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('key');

            if (token === EXPECTED_TOKEN) {
                document.getElementById('mainContainer').style.display = 'flex'; // Menggunakan flex agar gambar tetap di tengah
            } else {
                document.getElementById('accessDenied').style.display = 'block';
            }
        }

        // Jalankan pemeriksaan akses saat halaman dimuat
        checkAccess();

        // Blok klik kanan tambahan
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
