<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            padding-top: 25px;
        }

        /* Styling Judul Utama */
        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            text-align: center;
            margin-bottom: 6px;
        }

        /* Styling Teks Berjalan */
        .running-text {
            width: 100%;
            font-size: 14px;
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 15px;
        }

        /* Logo */
        img {
            max-width: 75%;
            max-height: 45vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
        }

        /* Container Informasi Modul Fisika SMA */
        .module-info {
            width: 95%;
            margin-top: 15px;
            padding: 15px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            text-align: center;
        }

        .module-info h3 {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .module-info p {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .module-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .module-item {
            font-size: 12px;
            background-color: #eff6ff;
            color: #1d4ed8;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: 600;
        }

        /* Styling Teks Footer */
        .footer-text {
            font-size: 14px;
            font-weight: bold;
            color: #64748b;
            margin-top: 15px;
            text-align: center;
        }

        /* Hari, Tanggal dan Jam */
        .datetime {
            margin-top: 10px;
            text-align: center;
            color: #475569;
        }

        .datetime .hari {
            font-size: 14px;
            font-weight: bold;
        }

        .datetime .tanggal {
            font-size: 12px;
            margin-top: 3px;
        }

        .datetime .jam {
            font-size: 20px;
            font-weight: bold;
            color: #2563eb;
            margin-top: 3px;
        }

        /* Tampilan saat akses ditolak */
        .access-denied {
            display: none;
            color: #dc2626;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>

<body oncontextmenu="return false;">

    <!-- Pesan jika dibuka langsung tanpa token -->
    <div id="accessDenied" class="access-denied">
        <h2>Akses Ditolak</h2>
        <p>Anda tidak memiliki izin untuk mengakses halaman ini secara langsung.</p>
    </div>

    <!-- Konten Utama -->
    <div class="container" id="mainContainer" style="display: none;">
        
        <!-- Judul Atas -->
        <h1 class="header-title">SMA KRISTEN SATYA WACANA</h1>
        
        <!-- Teks Berjalan -->
        <marquee class="running-text" behavior="scroll" direction="left" scrollamount="6">
            Leader - Explorer - Archiever - Disciple
        </marquee>

        <!-- Gambar Utama -->
        <img src="asesemen.png" alt="Gambar Tengah">

            <div class="module-info">
        <h3>Kata hari ini</h3>
       <!-- Tambahkan id="kataHariIni" -->
        <p id="kataHariIni"></p>
     </div>

        
        <!-- Hari, Tanggal dan Jam -->
        <div class="datetime">
            <div class="hari" id="hari"></div>
            <div class="tanggal" id="tanggal"></div>
            <div class="jam" id="jam"></div>
        </div>

    </div>

    <script>
        // ==========================================
        // VALIDASI SECURITY TOKEN DARI URL
        // ==========================================

        const EXPECTED_TOKEN = "AksesKhususGoogleSites2026";

        function checkAccess() {

            const urlParams =
                new URLSearchParams(window.location.search);

            const token = urlParams.get('key');

            if (token === EXPECTED_TOKEN) {

                document.getElementById('mainContainer')
                    .style.display = 'flex';

            } else {

                document.getElementById('accessDenied')
                    .style.display = 'block';
            }
        }


        // ==========================================
        // HARI, TANGGAL DAN JAM
        // ==========================================

        function tampilkanWaktu() {

            const sekarang = new Date();

            const namaHari = [
                "Minggu",
                "Senin",
                "Selasa",
                "Rabu",
                "Kamis",
                "Jumat",
                "Sabtu"
            ];

            const namaBulan = [
                "Januari",
                "Februari",
                "Maret",
                "April",
                "Mei",
                "Juni",
                "Juli",
                "Agustus",
                "September",
                "Oktober",
                "November",
                "Desember"
            ];

            const hari =
                namaHari[sekarang.getDay()];

            const tanggal =
                sekarang.getDate();

            const bulan =
                namaBulan[sekarang.getMonth()];

            const tahun =
                sekarang.getFullYear();

            const jam =
                String(sekarang.getHours()).padStart(2, "0");

            const menit =
                String(sekarang.getMinutes()).padStart(2, "0");

            const detik =
                String(sekarang.getSeconds()).padStart(2, "0");


            document.getElementById("hari").textContent =
                hari;

            document.getElementById("tanggal").textContent =
                tanggal + " " + bulan + " " + tahun;

            document.getElementById("jam").textContent =
                jam + ":" + menit + ":" + detik;
        }


        // ==========================================
        // JALANKAN PROGRAM
        // ==========================================

        // Pemeriksaan akses
        checkAccess();

        // Tampilkan waktu pertama kali
        tampilkanWaktu();

        // Perbarui jam setiap 1 detik
        setInterval(tampilkanWaktu, 1000);


        // ==========================================
        // BLOK KLIK KANAN
        // ==========================================

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

    </script>
<script>
    // Daftar kata/kalimat yang akan ditampilkan secara acak
    const daftarKata = [
        "Segala perkara dapat kutanggung di dalam Dia yang memberi kekuatan kepadaku.",
        "Serahkanlah perbuatanmu kepada TUHAN, maka terlaksanalah segala rencanamu.",
        "Takut akan TUHAN adalah permulaan pengetahuan, tetapi orang bodoh menghina hikmat dan didikan",
        "Hati orang berpengertian memperoleh pengetahuan, dan telinga orang bijak menuntut pengetahuan.",
        "Apa pun juga yang kamu perbuat, perbuatlah dengan segenap hatimu seperti untuk Tuhan dan bukan untuk manusia.",
        "Sebab Allah memberikan kepada kita bukan roh ketakutan, melainkan roh yang membangkitkan kekuatan, kasih dan ketertiban.",
		"Janganlah kita jemu-jemu berbuat baik, karena apabila sudah tiba waktunya, kita akan memetik hasilnya, kalau kita tidak menjadi lemah.",
        "Serahkanlah segala kekhawatiranmu kepada-Nya, sebab Ia yang memelihara kamu."
	];

    // Mengambil indeks secara acak berdasarkan panjang daftarKata
    const indexAcak = Math.floor(Math.random() * daftarKata.length);

    // Menampilkan kalimat acak ke dalam elemen HTML
    document.getElementById("kataHariIni").innerText = daftarKata[indexAcak];
</script>
</body>
</html>
