<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Mencegah Indeks Mesin Pencari -->
  <meta name="robots" content="noindex, nofollow">
  
  <title>Aplikasi Navigasi</title>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: Arial, sans-serif; 
    }
    
    html, body {
      width: 100%;
      height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      background-color: #1e293b;
    }
    
    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1e293b;
      padding: 6px;
      gap: 4px;
      flex-wrap: wrap;
      z-index: 10;
    }

    .nav-btn {
      background-color: #334155;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 6px;
      transition: background-color 0.2s;
      font-size: 14px;
      flex: 1 1 auto;
      max-width: 100px;
      text-align: center;
    }

    .nav-btn:hover, .nav-btn.active {
      background-color: #2563eb;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Menu Navigasi -->
  <div class="navbar">
    <button class="nav-btn active" onClick="loadPage('home.html', this)">Home</button>
    <button class="nav-btn" onClick="loadPage('zqscdrtkju34okvbfdehmksbgtsbhushjwonx.html', this)">Kelas X</button>
    <button class="nav-btn" onClick="loadPage('zqscdrtkju34okvbfdehmksbgtsbhushjwonxi.html', this)">Kelas XI</button>
    <button class="nav-btn" onClick="loadPage('zqscdrtkju34okvbfdehmksbgtsbhushjwon12.html', this)">Kelas XII</button>
  </div>

  <!-- Area Konten -->
  <div class="iframe-container">
    <iframe id="mainFrame" src="home.html"></iframe>
  </div>

  <script>
    const BASE_URL = ""; 

    function loadPage(fileName, element) {
      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      const iframe = document.getElementById('mainFrame');
      iframe.src = BASE_URL + fileName;
    }
  </script>

</body>
</html>
