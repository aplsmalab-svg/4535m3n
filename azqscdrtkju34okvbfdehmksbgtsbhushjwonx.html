<script>
  /* =========================================
     SECURITY TOKEN
     ========================================= */
  const EXPECTED_TOKEN = "AksesKhususGoogleSites2026";

  function checkAccess() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("key");

    if (token === EXPECTED_TOKEN) {
      document.getElementById("mainContainer").style.display = "block";
    } else {
      document.getElementById("accessDenied").style.display = "block";
    }
  }
  checkAccess();

  /* =========================================
     BUKA / TUTUP KELOMPOK (ACCORDION)
     ========================================= */
  function toggle(el) {
    let content = el.nextElementSibling;
    const semuaContent = document.querySelectorAll(".content");
    const akanDibuka = content.style.display !== "block";

    semuaContent.forEach(item => item.style.display = "none");

    if (akanDibuka) {
      content.style.display = "block";
      localStorage.setItem("kelompokTerakhir", el.innerText.trim());
    }
  }

  /* =========================================
     TANGGAL & JAM
     ========================================= */
  function updateDateTime() {
    const now = new Date();
    const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

    document.getElementById("datetime").innerHTML = 
      `${hari[now.getDay()]}, ${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()}<br>` +
      `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
  }
  setInterval(updateDateTime, 1000);
  updateDateTime();

  /* =========================================
     MANAJEMEN SOAL (IFRAME & LOCALSTORAGE)
     ========================================= */
  function bukaSoal(url) {
    // Simpan link soal yang dibuka ke localStorage
    localStorage.setItem("soalAktif", url);

    // Buat/tampilkan Container Iframe Soal
    let iframeContainer = document.getElementById("iframeSoalContainer");
    
    if (!iframeContainer) {
      iframeContainer = document.createElement("div");
      iframeContainer.id = "iframeSoalContainer";
      iframeContainer.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:9999;";
      
      // Tombol kembali (opsional jika siswa ingin memilih soal lain)
      const btnTutup = document.createElement("button");
      btnTutup.innerText = "? Kembali ke Menu Soal";
      btnTutup.style.cssText = "position:absolute; top:10px; right:10px; padding:8px 12px; background:#dc3545; color:white; border:none; border-radius:5px; cursor:pointer; z-index:10000;";
      btnTutup.onclick = tutupSoal;
      
      const iframe = document.createElement("iframe");
      iframe.id = "frameSoal";
      iframe.style.cssText = "width:100%; height:100%; border:none;";
      
      iframeContainer.appendChild(btnTutup);
      iframeContainer.appendChild(iframe);
      document.body.appendChild(iframeContainer);
    } else {
      iframeContainer.style.display = "block";
    }

    document.getElementById("frameSoal").src = url;
  }

  function tutupSoal() {
    localStorage.removeItem("soalAktif");
    const iframeContainer = document.getElementById("iframeSoalContainer");
    if (iframeContainer) iframeContainer.style.display = "none";
  }

  // Pasang event listener pada setiap tombol soal
  document.querySelectorAll("a.btn").forEach(link => {
    link.addEventListener("click", function(e) {
      if (link.classList.contains("btn-nilai")) return; // Abaikan tombol lihat nilai

      e.preventDefault(); // Cegah pindah halaman bawaan <a>
      bukaSoal(this.href);
    });

    link.addEventListener("auxclick", e => e.preventDefault());
  });

  /* =========================================
     PULIHKAN SOAL & KELOMPOK SAAT PAGE REFRESH
     ========================================= */
  window.addEventListener("load", function() {
    // 1. Cek apakah ada soal yang sedang aktif saat halaman direfresh
    const soalAktif = localStorage.getItem("soalAktif");
    if (soalAktif) {
      bukaSoal(soalAktif);
    }

    // 2. Pulihkan menu kelompok (accordion) terakhir
    const kelompokTerakhir = localStorage.getItem("kelompokTerakhir");
    if (kelompokTerakhir) {
      document.querySelectorAll(".label").forEach(label => {
        if (label.innerText.trim() === kelompokTerakhir) {
          label.nextElementSibling.style.display = "block";
        }
      });
    }
  });

  /* =========================================
     NONAKTIFKAN KLIK KANAN
     ========================================= */
  document.addEventListener("contextmenu", e => e.preventDefault());
</script>
