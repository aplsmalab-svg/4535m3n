<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Soal</title>
  <meta name="robots" content="noindex, nofollow, noarchive">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Container untuk membuat tombol berjejer mendatar */
    .menu-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      position: relative;
    }

    .jadwal {
      position: relative; /* Penting untuk posisi dropdown */
      flex: 1 1 auto;
      min-width: 120px;
    }

    .label {
      background: #007bff;
      color: white;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
      user-select: none;
    }

    .label:hover {
      background: #0056b3;
    }

    /* Content/Menu drop-down melayang */
    .content {
      display: none;
      position: absolute;
      top: 105%;
      left: 0;
      width: 220px;
      background: #ffffff;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
      z-index: 100;
    }

    .btn {
      display: block;
      padding: 10px;
      margin: 4px 0;
      text-align: center;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
    }

    .btn:hover {
      background: #218838;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .access-denied {
      display: none;
      color: #dc2626;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<!-- Pesan jika dibuka tanpa token -->
<div id="accessDenied" class="access-denied">
  <h2>Akses Ditolak</h2>
  <p>Anda tidak memiliki izin untuk mengakses halaman ini secara langsung.</p>
</div>

<!-- Konten Utama -->
<div class="container" id="mainContainer" style="display: none;">
  
  <div class="menu-bar">
    <!-- JAM KE-1 -->
    <div class="jadwal">
      <div class="label" onClick="toggle(this)">Jam ke-1</div>
      <div class="content">
        <a href="https://linksoal1c.com" class="btn" style="display:none;">Paket C</a>
      </div>
    </div>
            
    <!-- JAM KE-2 -->
    <div class="jadwal">
      <div class="label" onClick="toggle(this)">Jam ke-2</div>
      <div class="content">
        <a href="https://linksoal1c.com" class="btn" style="display:none;">Paket C</a>
      </div>
    </div>

    <!-- JAM KE-3 -->
    <div class="jadwal">
      <div class="label" onClick="toggle(this)">Jam ke-3</div>
      <div class="content">
        <a href="https://linksoal1c.com" class="btn" style="display:none;">Paket C</a>
      </div>
    </div>
    
    <!-- UMUM -->
    <div class="jadwal">
      <div class="label" onClick="toggle(this)">UH / Remidi / Literasi</div>
      <div class="content">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScHdQYa3bui2mj9m7zBt4dzUeAhHb6yiKq8zQW2ZfNxabWIOw/viewform" class="btn">UH Fisika Pengukuran</a>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSegsnQK8MTQG5BeNgm3gU5fGkgfOiGAhOl-ynG7zrePirpPtA/viewform" class="btn">Literasi/Numerasi</a>
        <a href="https://linksoal1c.com" class="btn" style="display:none;">Paket C</a>
      </div>
    </div>
  </div>

</div>

<script>
  // Validasi Security Token dari URL
  const EXPECTED_TOKEN = "AksesKhususGoogleSites2026";

  function checkAccess() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('key');

    if (token === EXPECTED_TOKEN) {
      document.getElementById('mainContainer').style.display = 'block';
    } else {
      document.getElementById('accessDenied').style.display = 'block';
    }
  }

  checkAccess();

  // Toggle buka-tutup menu (Tutup menu lain jika ada yang dibuka)
  function toggle(el) {
    const allContents = document.querySelectorAll('.content');
    const targetContent = el.nextElementSibling;
    
    // Sembunyikan dropdown lainnya dulu
    allContents.forEach(content => {
      if (content !== targetContent) {
        content.style.display = "none";
      }
    });

    // Buka/Tutup menu yang diklik
    targetContent.style.display = (targetContent.style.display === "block") ? "none" : "block";
  }

  // Tutup menu jika klik di luar area menu
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.jadwal')) {
      document.querySelectorAll('.content').forEach(c => c.style.display = 'none');
    }
  });

  // Nonaktifkan klik kanan
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Paksa buka di halaman yang sama
  document.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = this.href;
    });

    link.addEventListener('auxclick', function(e) {
      e.preventDefault();
    });
  });
</script>

</body>
</html>
